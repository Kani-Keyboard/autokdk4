# ZMK Studioによる設定変更をロックしない
CONFIG_ZMK_STUDIO_LOCKING=n

# ポインティングデバイス機能を有効にする
CONFIG_ZMK_POINTING=y

# PAW3222トラックボールセンサーのドライバーを有効にする
CONFIG_PAW3222=y

# この右側をCentral（親機）として動作させる
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ポインティングのスクロールを滑らかにする
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# キー押下の信号が10ms安定したら押下として確定する
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10

# キー解放の信号が10ms安定したら解放として確定する
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
